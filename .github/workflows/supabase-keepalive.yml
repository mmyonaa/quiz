# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트가 일시정지된다 (issue #8).
# 3일마다 가벼운 요청 1회로 활동을 유지한다. 테이블 존재 여부와 무관하게
# 항상 성공하는 auth health 엔드포인트를 사용 — 게이트웨이를 지나는 요청이면 활동으로 집계된다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
