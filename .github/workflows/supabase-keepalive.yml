# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트가 일시정지된다 (issue #8).
#
# 정지 판정의 기준은 "게이트웨이를 지난 요청"이 아니라 실제 Postgres 쿼리다.
# 초판은 테이블에 의존하지 않으려고 auth health 엔드포인트를 쳤는데, 그 경로는 DB를
# 건드리지 않는다 — 3일마다 200을 받으며 초록불이 떠 있는 채로 2026-09-04~09-07 사이에
# 정지됐다. 초록불이 오히려 안심시킨 셈이다.
#
# 그래서 PostgREST로 실제 테이블을 읽는다. anon 키라 RLS가 결과를 빈 배열로 만들지만,
# 쿼리 자체는 Postgres에서 실행되므로 활동으로 집계된다. 주기도 7일 기준에 여유를 두려고
# 3일 → 매일로 좁혔다. 테이블에 의존하게 된 만큼 실패는 아래 단계가 이슈로 띄운다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/saved_notes?select=question_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: 실패하면 이슈를 연다
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Supabase keep-alive 핑 실패 — 프로젝트 정지 위험"
        run: |
          # 매일 도는 워크플로다. 같은 제목의 열린 이슈가 있으면 다시 열지 않는다.
          if [ -n "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[].number')" ]; then
            echo "이미 열린 이슈가 있다 — 중복 생성하지 않는다."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$(printf '%s\n' \
            'keep-alive 핑이 실패했다. 이 상태가 이어지면 Supabase 무료 플랜 프로젝트가' \
            '7일 무활동으로 일시정지되고, 로그인·오답노트가 함께 멈춘다.' \
            '' \
            "실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '' \
            '확인할 것 — 프로젝트가 이미 정지됐는지(정지되면 DNS가 NXDOMAIN이 된다),' \
            '`saved_notes` 테이블과 anon 권한이 그대로인지, 시크릿이 만료되지 않았는지.')"
