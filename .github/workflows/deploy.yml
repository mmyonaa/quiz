# Astro를 빌드해 GitHub Pages로 배포한다 (blog 레포와 같은 공식).
# Pages 소스는 "GitHub Actions" 방식 — 레포를 public으로 전환하고
# Settings > Pages > Source를 GitHub Actions로 설정한 뒤,
# 아래 on: 에 push 트리거(branches: [main])를 복구하면 main push마다 배포된다.
# 현재는 레포가 private라 Pages 배포가 실패하므로 수동 실행만 허용한다.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
