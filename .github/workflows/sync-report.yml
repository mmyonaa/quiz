# 주간 블로그 싱크 — daily.mcp 글과 문항 은행의 어긋남을 감지한다.
#
# 보고를 둘로 가른다. **사건**은 주간 이슈로, **백로그**는 상시 이슈 하나로.
# 초판은 둘을 한 이슈에 섞었는데, 그 안의 '글 연결 갭'(문항은 있는데 개념 글이 없는 주제)은
# 몇 달 단위로 줄어드는 목록이라 99줄이 매주 통째로 복제됐다. 게다가 그 목록이 빌 날이
# 없으니 NO_FINDINGS 분기가 사실상 죽어, 변경이 하나도 없는 주에도 이슈가 열렸다 —
# 이슈 5건의 본문 95%가 서로 같았다. "이슈가 떴다 = 볼 게 생겼다"는 신호가 그렇게 죽는다.
#
# ① 주간 이슈(그 주에 생긴 일만): 죽은 relatedPost · 문항이 참조하는 글의 개정 ·
#    새로 생긴 커버리지 갭. 보고한 것은 sync-state.json에 남아 다음 주에 다시 실리지 않으므로
#    조용한 주에는 이슈가 아예 열리지 않는다.
# ② 상시 이슈(아직 메워지지 않은 자리 전량): 커버리지 갭 · 글 연결 갭. 매주 같은 이슈의
#    본문을 덮어쓴다. 남은 자리가 없어지면 닫는다.
# ③ 검증 이슈(자동 연결분): 제목이 또렷하게 겹치는 자리는 --link가 직접 붙이고, 붙인 것을
#    이 이슈로 올린다. 사람 몫은 둘로 좁혀진다 — 붙은 것을 검증하고, 임계 아래로 남은
#    후보에서 고르는 것. 조용히 들어가는 연결을 만들지 않는 것이 자동 연결의 조건이라,
#    보고가 안 되면(이슈 생성 실패) 연결도 하지 않은 것으로 봐야 한다.
name: Weekly blog sync report

on:
  schedule:
    - cron: "0 22 * * 0" # 매주 월요일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run sync report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/blog-sync.mjs --report > report.md
      - name: Create issue if findings exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "^NO_FINDINGS$" report.md; then
            echo "보고할 변경 없음"
          else
            gh issue create \
              --title "주간 블로그 싱크 리포트 $(TZ=Asia/Seoul date +%F)" \
              --body-file report.md \
              --repo "$GITHUB_REPOSITORY"
          fi
      # 임계값 역채점. 주제·글이 늘어 안전선이 흔들리면 여기서 멈춘다 — 자동 연결은 이 선으로만
      # 지켜지므로, 통과하지 못하면 이번 주는 붙이지 않고 사람이 후보로 받는 편이 낫다.
      - name: Backtest auto-link thresholds
        run: node scripts/blog-sync.mjs --backtest

      # --report가 섹션을 캐시한 뒤에 돈다(갓 올라온 글이 시험 글인지 상태를 봐야 안다).
      # 자동분은 별도 커밋 하나로 남긴다 — 검증에서 뒤집히면 그 커밋만 되돌리면 된다.
      - name: Auto-link posts and propose candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/blog-sync.mjs --link > link.md
          # 보고가 먼저다. 이슈 생성이 실패하면 이 단계가 여기서 죽고 연결은 커밋되지 않는다 —
          # 검증 목록 없이 들어간 자동 연결을 남기지 않기 위한 순서다.
          if grep -q "^NO_FINDINGS$" link.md; then
            echo "자동 연결·후보 없음"
          else
            gh issue create \
              --title "자동 연결 검증 $(TZ=Asia/Seoul date +%F)" \
              --body-file link.md \
              --repo "$GITHUB_REPOSITORY"
          fi
          if ! git diff --quiet src/data/topic-notes.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -q -m "chore(sync): 자동 연결 — 제목 유사도 임계 통과분" src/data/topic-notes.json
            git push
          fi

      # --report가 갱신해 둔 상태와 --link가 붙인 연결 위에서 돌아야 하므로 순서가 중요하다.
      - name: Update standing backlog issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "블로그 싱크 백로그 — 커버리지 갭 · 글 연결 갭"
        run: |
          node scripts/blog-sync.mjs --backlog > backlog.md
          # --search는 흐릿하게 맞춘다. 제목이 정확히 같은 것만 골라 엉뚱한 이슈를 덮어쓰지 않는다.
          num=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if grep -q "^NO_FINDINGS$" backlog.md; then
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "메워지지 않은 자리가 남지 않았다 — 다시 생기면 이 워크플로가 새로 연다."
            else
              echo "남은 자리 없음 — 열어 둘 이슈도 없다"
            fi
          elif [ -n "$num" ]; then
            gh issue edit "$num" --body-file backlog.md
            echo "백로그 이슈 #$num 갱신"
          else
            gh issue create --title "$TITLE" --body-file backlog.md --repo "$GITHUB_REPOSITORY"
          fi
      - name: Commit updated sync state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/sync-state.json
          if git diff --cached --quiet; then
            echo "상태 변경 없음"
          else
            git commit -m "chore: sync-state 갱신 — 주간 블로그 싱크 리포트"
            git push
          fi
